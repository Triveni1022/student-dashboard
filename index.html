<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>📊 Student Dashboard</h1>

<canvas id="chart"></canvas>

<script>
fetch("https://opensheet.elk.sh/1KoR7magc0jJQIHLC-mHVxCtljimQAVv1XJITuY114QY/Sheet1")
  .then(res => res.json())
  .then(data => {
    const problems = data.map(d => Number(d.problems_solved));

    new Chart(document.getElementById("chart"), {
      type: "bar",
      data: {
        labels: data.map(d => d.user_id),
        datasets: [{
          label: "Problems Solved",
          data: problems
        }]
      }
    });
  });
</script>

</body>
</html>
